<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f3ed" />
    <title>Offline · Quadrant Towers</title>
    <style>
      body {
        font:
          16px/1.6 system-ui,
          sans-serif;
        background: #f5f3ed;
        color: #272c29;
        margin: 0;
        padding: 24px;
        min-height: 80svh;
        display: grid;
        place-content: center;
      }
      main {
        max-width: 360px;
      }
      h1 {
        font-size: 28px;
      }
      a {
        display: inline-block;
        background: #275d47;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        padding: 12px 24px;
      }
      a:focus-visible {
        outline: 3px solid #275d47;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to return to your seat. Your turn timer keeps running.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
