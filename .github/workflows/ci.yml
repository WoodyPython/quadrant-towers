name: Project checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: project-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip checks]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: quadrant
          POSTGRES_PASSWORD: quadrant_local
          POSTGRES_DB: quadrant_towers
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quadrant -d quadrant_towers"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: corepack pnpm format:check
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm test:integration
      - run: corepack pnpm build
      - run: corepack pnpm db:check
      - run: corepack pnpm db:migrate
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  deploy:
    needs: check
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.RAILWAY_DEPLOY_ENABLED == 'true' &&
      (needs.check.result == 'success' ||
      contains(github.event.head_commit.message, '[skip checks]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: railway-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global @railway/cli@5.44.0
      - run: node scripts/deploy.mjs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
