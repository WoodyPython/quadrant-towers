services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: quadrant
      POSTGRES_PASSWORD: quadrant_local
      POSTGRES_DB: quadrant_towers
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quadrant -d quadrant_towers']
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
